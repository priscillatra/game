steps:
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args: ['-c', 'pip install -r requirements.txt && pip install pytest && pytest -q']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '-docker.pkg.dev/lab1-495500//ship-it:', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '-docker.pkg.dev/lab1-495500//ship-it:']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: ['run', 'deploy', 'ship-it',
           '--image', '-docker.pkg.dev/lab1-495500//ship-it:',
           '--region', '',
           '--allow-unauthenticated']

substitutions:
  _REGION: 'us-central1'
  _REPO: 'labs'

options:
  logging: CLOUD_LOGGING_ONLY
